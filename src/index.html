:root {
  --bg: #0b0a08; --surface: #15130f; --surface2: #100e0b; --line: #2a261e; --text: #ece4d3; --muted: #a1977f;
  --gold: #c9a55c; --gold-dim: #7d6a42; --cinnabar: #c4553f;
  --f-display: "Old Standard TT", "PT Serif", Georgia, serif;
  --f-text: "PT Serif", Georgia, "Times New Roman", serif;
  --f-ui: "PT Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-slav: "Old Standard TT", "PT Serif", Georgia, serif;   /* escrita civil legível (B3); Ponomar fica para um modo de eslavo autêntico */
  --scale: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
/* O tamanho do texto escolhido aplica-se à raiz: todas as medidas em rem acompanham-no (e o tamanho do sistema também). */
html { font-size: calc(100% * var(--scale)); }
body { font: 1rem / 1.5 var(--f-ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
select { font: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* Barra superior */
#top { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid var(--line); }
#top .titulo { justify-self: center; display: flex; align-items: center; gap: 8px; font: 400 1.1rem/1.2 var(--f-display); min-width: 0; }
#top .titulo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--surface); }
.icon-btn:disabled { opacity: .35; cursor: default; }

/* Conteúdo */
#main { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.screen { max-width: 680px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
.data-civil { font: 400 1.6rem / 1.15 var(--f-display); margin: 0; text-wrap: balance; }
.data-juliana { color: var(--muted); font-size: .9rem; }
.navdia { display: flex; align-items: center; gap: 4px; }
.navdia .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 .74rem/1 var(--f-ui); letter-spacing: .03em; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.jejum { color: var(--text); border-color: var(--gold-dim); }
.chip.festa { color: var(--cinnabar); border-color: #5a2e24; }
.bloco { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.bloco h2 { margin: 0; font: 700 .72rem/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.festa-principal { font: 400 1.15rem/1.35 var(--f-text); color: var(--cinnabar); }
.festa-principal.normal { color: var(--text); }
.lista { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-family: var(--f-text); }
.lista li { line-height: 1.4; }
.lista .fase { color: var(--muted); font: 400 .82rem var(--f-ui); }
.nivel { font: 400 1.05rem/1.35 var(--f-text); }
.desc { color: var(--muted); font-size: .9rem; }
.nota { color: var(--muted); font-size: .82rem; border-left: 2px solid var(--line); padding-left: 10px; }
.nota.typikon { border-left-color: var(--gold-dim); }
.link { color: var(--gold); font-size: .88rem; justify-self: start; min-height: 44px; display: inline-flex; align-items: center; }
.camada { font: 700 .7rem/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.read { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-text); }
.read span:first-child { flex: none; max-width: 45%; }
/* Listas longas (p. ex. os Evangelhos da Sexta-feira Santa) partem em várias linhas em vez de transbordar o ecrã. */
.read span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 0; overflow-wrap: anywhere; }

/* Calendário */
.mes-cab { display: flex; align-items: center; justify-content: space-between; }
.mes-cab h1 { margin: 0; font: 400 1.3rem/1.2 var(--f-display); }
.grelha { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-variant-numeric: tabular-nums; }
.grelha .dow { font: 700 .7rem/1 var(--f-ui); color: var(--muted); padding: 8px 0; letter-spacing: .04em; }
.grelha .dow.dom { color: var(--cinnabar); }
.dia { position: relative; min-height: 52px; border-radius: 10px; display: grid; align-content: center; gap: 1px; padding: 4px 0 8px; }
.dia b { font: 400 1rem/1.1 var(--f-ui); }
.dia small { font-size: .62rem; color: var(--muted); }
.dia.dom b { color: var(--cinnabar); }
.dia.festa b { color: var(--cinnabar); font-weight: 700; }
.dia.hoje { box-shadow: inset 0 0 0 1px var(--gold); }
.dia.sel { background: var(--surface); }
.dia.jejum::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--gold); }
.dia:active { background: var(--surface); }
.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.legenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* Orações */
.menu { margin: 0; padding: 0; list-style: none; display: grid; }
.menu li + li { border-top: 1px solid var(--line); }
.item { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font: 400 1.05rem/1.3 var(--f-text); padding: 8px 2px; }
.item svg { color: var(--muted); flex: none; }
.item small { color: var(--muted); font: 400 .75rem var(--f-ui); flex: none; }
.item:disabled { color: var(--muted); cursor: default; }
.oracao { gap: 14px; }
.estado { justify-self: start; font: 700 .68rem/1 var(--f-ui); letter-spacing: .06em; padding: 6px 9px; border-radius: 6px; background: #211c12; color: var(--gold); }
.rubrica { margin: 0; color: var(--cinnabar); font: italic 400 .92rem/1.45 var(--f-text); }
.titulo-oracao { margin: 8px 0 0; font: 400 1.15rem/1.3 var(--f-display); color: var(--gold); }
.par { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.slav { margin: 0; font: 400 1.08rem/1.55 var(--f-slav); }
.trad { margin: 0; font: 400 1.02rem/1.6 var(--f-text); color: #d6ccb8; }

/* Definições */
.campo { display: grid; gap: 8px; }
.campo label { font-weight: 700; font-size: .9rem; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--text); background: var(--surface); }
.txt { color: var(--muted); font-size: .92rem; max-width: 65ch; }
.vazio { display: grid; gap: 12px; justify-items: center; text-align: center; padding-top: 48px; color: var(--muted); }
.vazio svg { width: 40px; height: 56px; color: var(--gold-dim); }
.vazio h1 { margin: 0; font: 400 1.3rem var(--f-display); color: var(--text); }

/* Barra de separadores */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface2);
  padding: 6px max(4px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left)); }
.tab { display: grid; justify-items: center; gap: 3px; min-height: 48px; align-content: center; font-size: .68rem; color: var(--muted); border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--gold); }
/* ── Animações (decisão 59): só opacity/transform (compositor da GPU), curtas; nenhuma com menos movimento pedido. */
/* Ecrã de arranque: no HTML, visível antes do JavaScript; a barra segue o carregamento real (app.js define --p). */
#arranque { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 28px; background: var(--bg);
  transition: opacity .28s ease, visibility .28s; animation: arranque-recurso .3s 8s forwards; }
#arranque svg { width: 46px; height: 64px; color: var(--gold); animation: arranque-cruz .5s ease-out both; }
#arranque .barra { width: 132px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
#arranque .barra i { display: block; height: 100%; background: var(--gold); transform-origin: left; transform: scaleX(var(--p, .08));
  transition: transform .22s ease-out; animation: arranque-barra .7s ease-out both; }
#arranque.js .barra i { animation: none; }
#arranque.fim { opacity: 0; visibility: hidden; }
@keyframes arranque-cruz { from { opacity: 0; transform: scale(.96); } }
@keyframes arranque-barra { from { transform: scaleX(.02); } to { transform: scaleX(.35); } }
@keyframes arranque-recurso { to { opacity: 0; visibility: hidden; } }   /* se o JavaScript falhar, o ecrã não fica preso */
/* Mudança de ecrã: fade-out do antigo e fade-in do novo (View Transitions nativas); barra de cima e separadores fixos. */
#main { view-transition-name: conteudo; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(conteudo) { animation: .14s ease-in both vt-sai; }
::view-transition-new(conteudo) { animation: .2s ease-out both vt-entra; }
@keyframes vt-sai { to { opacity: 0; } }
@keyframes vt-entra { from { opacity: 0; transform: translateY(6px); } }
.screen.entra { animation: vt-entra .2s ease-out both; }   /* browsers sem View Transitions: só o fade-in */
.nota[role="status"] { animation: vt-entra .2s ease-out both; }
/* Resposta ao toque */
.tab svg, .icon-btn svg { transition: transform .12s ease-out; }
.tab:active svg, .icon-btn:active svg { transform: scale(.9); }
.item, .seg button, .link, .dia, .icon-btn { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
@media (prefers-reduced-motion: no-preference) { #main { scroll-behavior: smooth; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; transition: none !important; }
}
</style>
